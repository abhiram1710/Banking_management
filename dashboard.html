<!DOCTYPE html>
<html>

<head>
    <title>Bank Dashboard</title>

    <style>

        body {
            font-family: Arial;
            padding: 30px;
            background: linear-gradient(to right, #5f7cff, #8a4bd6);
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 220px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            margin: 3px;
        }

        .createBtn {
            background: green;
        }

        .depositBtn {
            background: blue;
        }

        .withdrawBtn {
            background: orange;
        }

        .deleteBtn {
            background: red;
        }

        .loadBtn {
            background: purple;
        }

        .logoutBtn {
            background: gray;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        h1, h2 {
            color: black;
        }

    </style>

</head>

<body>

<div class="container">

    <h1 id="welcomeText"></h1>

    <button class="logoutBtn" onclick="logout()">
        Logout
    </button>

    <br><br>

    <h2>Create Account</h2>

    <input
            type="text"
            id="name"
            placeholder="Account Holder Name">

    <input
            type="number"
            id="balance"
            placeholder="Initial Balance">

    <button
            class="createBtn"
            onclick="createAccount()">
        Create
    </button>

    <br><br>

    <h2>Accounts</h2>

    <button
            class="loadBtn"
            onclick="loadAccounts()">
        Load Accounts
    </button>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Balance</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody id="tableBody"></tbody>

    </table>

</div>

<script>

    const BASE_URL =
        "https://banking-management-stlh.onrender.com";

    const username =
        localStorage.getItem("username");

    if (!username) {

        window.location.href = "login.html";
    }

    document.getElementById("welcomeText").innerText =
        "Welcome " + username;

    // CREATE ACCOUNT

    async function createAccount() {

        const name =
            document.getElementById("name").value;

        const balance =
            document.getElementById("balance").value;

        if(name === "" || balance === "") {

            alert("Enter all fields");
            return;
        }

        try {

            const response = await fetch(
                `${BASE_URL}/accounts/create`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        balance: balance
                    })
                }
            );

            const data = await response.text();

            alert(data);

            loadAccounts();

        } catch(error) {

            console.log(error);

            alert("Create Account Failed");
        }
    }

    // LOAD ACCOUNTS

    async function loadAccounts() {

        try {

            const response =
                await fetch(`${BASE_URL}/accounts/all`);

            const accounts =
                await response.json();

            const tableBody =
                document.getElementById("tableBody");

            tableBody.innerHTML = "";

            accounts.forEach(account => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `

                    <td>${account.id}</td>

                    <td>${account.name}</td>

                    <td>₹ ${account.balance}</td>

                    <td>

                        <button
                            class="depositBtn"
                            onclick="depositMoney(${account.id})">
                            Deposit
                        </button>

                        <button
                            class="withdrawBtn"
                            onclick="withdrawMoney(${account.id})">
                            Withdraw
                        </button>

                        <button
                            class="deleteBtn"
                            onclick="deleteAccount(${account.id})">
                            Delete
                        </button>

                    </td>
                `;

                tableBody.appendChild(row);

            });

        } catch(error) {

            console.log(error);

            alert("Failed to Load Accounts");
        }
    }

    // DEPOSIT

    async function depositMoney(id) {

        const amount =
            prompt("Enter deposit amount");

        if(amount == null || amount === "") {
            return;
        }

        try {

            const response = await fetch(
                `${BASE_URL}/accounts/deposit/${id}?amount=${amount}`,
                {
                    method: "PUT"
                }
            );

            const data =
                await response.text();

            alert(data);

            loadAccounts();

        } catch(error) {

            console.log(error);

            alert("Deposit Failed");
        }
    }

    // WITHDRAW

    async function withdrawMoney(id) {

        const amount =
            prompt("Enter withdraw amount");

        if(amount == null || amount === "") {
            return;
        }

        try {

            const response = await fetch(
                `${BASE_URL}/accounts/withdraw/${id}?amount=${amount}`,
                {
                    method: "PUT"
                }
            );

            const data =
                await response.text();

            alert(data);

            loadAccounts();

        } catch(error) {

            console.log(error);

            alert("Withdraw Failed");
        }
    }

    // DELETE ACCOUNT

    async function deleteAccount(id) {

        const confirmDelete =
            confirm("Delete this account?");

        if(!confirmDelete) {
            return;
        }

        try {

            const response = await fetch(
                `${BASE_URL}/accounts/${id}`,
                {
                    method: "DELETE"
                }
            );

            const data =
                await response.text();

            alert(data);

            loadAccounts();

        } catch(error) {

            console.log(error);

            alert("Delete Failed");
        }
    }

    // LOGOUT

    function logout() {

        localStorage.removeItem("username");

        window.location.href = "login.html";
    }

    // AUTO LOAD ACCOUNTS

    loadAccounts();

</script>

</body>
</html>
