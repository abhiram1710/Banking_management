<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background: linear-gradient(to right, #5f7cff, #8a4bd6);
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 220px;
        }

        button {
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            color: white;
        }

        .createBtn {
            background: green;
        }

        .deleteBtn {
            background: red;
        }

        .depositBtn {
            background: blue;
        }

        .withdrawBtn {
            background: orange;
        }

        .logoutBtn {
            background: gray;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>

</head>

<body>

<div class="container">

    <h1 id="welcomeText"></h1>

    <button class="logoutBtn" onclick="logout()">Logout</button>

    <br><br>

    <h2>Create Account</h2>

    <input type="text" id="name" placeholder="Account Holder Name">

    <input type="number" id="balance" placeholder="Initial Balance">

    <button class="createBtn" onclick="createAccount()">
        Create
    </button>

    <h2>Accounts</h2>

    <button onclick="loadAccounts()">Load Accounts</button>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Balance</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody id="tableBody"></tbody>

    </table>

</div>

<script>

    const BASE_URL =
        "https://banking-management-stlh.onrender.com";

    const username = localStorage.getItem("username");

    if (!username) {
        window.location.href = "login.html";
    }

    document.getElementById("welcomeText").innerText =
        "Welcome " + username;

    async function createAccount() {

        const name =
            document.getElementById("name").value;

        const balance =
            document.getElementById("balance").value;

        const response = await fetch(
            `${BASE_URL}/accounts/create`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    balance: balance
                })
            }
        );

        const data = await response.text();

        alert(data);

        loadAccounts();
    }

    async function loadAccounts() {

        const response =
            await fetch(`${BASE_URL}/accounts/all`);

        const accounts = await response.json();

        const tableBody =
            document.getElementById("tableBody");

        tableBody.innerHTML = "";

        accounts.forEach(account => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${account.id}</td>
                <td>${account.name}</td>
                <td>${account.balance}</td>

                <td>

                    <button
                        class="deleteBtn"
                        onclick="deleteAccount(${account.id})">
                        Delete
                    </button>

                    <button
                        class="depositBtn"
                        onclick="depositMoney(${account.id})">
                        Deposit
                    </button>

                    <button
                        class="withdrawBtn"
                        onclick="withdrawMoney(${account.id})">
                        Withdraw
                    </button>

                </td>
            `;

            tableBody.appendChild(row);
        });
    }

    async function deleteAccount(id) {

        const response = await fetch(
            `${BASE_URL}/accounts/${id}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.text();

        alert(data);

        loadAccounts();
    }

    async function depositMoney(id) {

        const amount =
            prompt("Enter deposit amount");

        if(amount == null) return;

        const response = await fetch(
            `${BASE_URL}/accounts/deposit/${id}?amount=${amount}`,
            {
                method: "PUT"
            }
        );

        const data = await response.text();

        alert(data);

        loadAccounts();
    }

    async function withdrawMoney(id) {

        const amount =
            prompt("Enter withdraw amount");

        if(amount == null) return;

        const response = await fetch(
            `${BASE_URL}/accounts/withdraw/${id}?amount=${amount}`,
            {
                method: "PUT"
            }
        );

        const data = await response.text();

        alert(data);

        loadAccounts();
    }

    function logout() {

        localStorage.removeItem("username");

        window.location.href = "login.html";
    }

</script>

</body>

</html>
