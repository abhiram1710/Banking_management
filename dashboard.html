<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>

    <style>

        body{
            font-family: Arial;
            padding:40px;
            margin:0;
            background: linear-gradient(to right,#5f72ff,#9b23ea);
        }

        .container{
            background:white;
            padding:40px;
            border-radius:20px;
        }

        input{
            padding:10px;
            width:250px;
            margin-right:10px;
        }

        button{
            padding:10px 15px;
            border:none;
            border-radius:5px;
            color:white;
            cursor:pointer;
        }

        .create-btn{
            background:green;
        }

        .load-btn{
            background:purple;
        }

        .deposit-btn{
            background:blue;
        }

        .withdraw-btn{
            background:orange;
        }

        .delete-btn{
            background:red;
        }

        .logout-btn{
            background:gray;
        }

        table{
            width:100%;
            border-collapse: collapse;
            margin-top:20px;
        }

        table, th, td{
            border:1px solid black;
        }

        th, td{
            padding:10px;
            text-align:center;
        }

    </style>

</head>

<body>

<div class="container">

    <h1 id="welcomeText"></h1>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

    <br><br><br>

    <h2>Create Account</h2>

    <input
        type="text"
        id="name"
        placeholder="Enter Name"
    >

    <input
        type="number"
        id="balance"
        placeholder="Enter Balance"
    >

    <button
        class="create-btn"
        onclick="createAccount()"
    >
        Create
    </button>

    <br><br><br>

    <h2>Accounts</h2>

    <button
        class="load-btn"
        onclick="loadAccounts()"
    >
        Load Accounts
    </button>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Balance</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody id="accountsTable">

        </tbody>

    </table>

</div>

<script>

const API_URL =
"https://banking-management-stlh.onrender.com/api/accounts";

document.getElementById("welcomeText").innerText =
"Welcome " + localStorage.getItem("username");

function logout(){

    localStorage.clear();

    window.location.href = "login.html";
}

async function createAccount(){

    const name =
    document.getElementById("name").value;

    const balance =
    document.getElementById("balance").value;

    if(name === "" || balance === ""){

        alert("Enter details");
        return;
    }

    try{

        const response =
        await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                name:name,
                balance:balance
            })

        });

        if(response.ok){

            alert("Account Created");

            loadAccounts();
        }

    }catch(error){

        console.log(error);

        alert("Create Failed");
    }
}

async function loadAccounts(){

    try{

        const response =
        await fetch(API_URL);

        const data =
        await response.json();

        const table =
        document.getElementById("accountsTable");

        table.innerHTML = "";

        data.forEach(account => {

            table.innerHTML += `

            <tr>

                <td>${account.id}</td>

                <td>${account.name}</td>

                <td>₹${account.balance}</td>

                <td>

                    <button
                    class="deposit-btn"
                    onclick="deposit(${account.id}, ${account.balance})">
                    Deposit
                    </button>

                    <button
                    class="withdraw-btn"
                    onclick="withdrawMoney(${account.id}, ${account.balance})">
                    Withdraw
                    </button>

                    <button
                    class="delete-btn"
                    onclick="deleteAccount(${account.id})">
                    Delete
                    </button>

                </td>

            </tr>

            `;
        });

    }catch(error){

        console.log(error);

        alert("Failed to Load Accounts");
    }
}

async function deposit(id,balance){

    let amount =
    prompt("Enter Deposit Amount");

    if(amount == null) return;

    amount = parseFloat(amount);

    const newBalance =
    balance + amount;

    updateBalance(id,newBalance);
}

async function withdrawMoney(id,balance){

    let amount =
    prompt("Enter Withdraw Amount");

    if(amount == null) return;

    amount = parseFloat(amount);

    if(amount > balance){

        alert("Insufficient Balance");
        return;
    }

    const newBalance =
    balance - amount;

    updateBalance(id,newBalance);
}

async function updateBalance(id,newBalance){

    const response =
    await fetch(API_URL);

    const accounts =
    await response.json();

    const account =
    accounts.find(acc => acc.id == id);

    await fetch(API_URL,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            id:account.id,
            name:account.name,
            balance:newBalance
        })

    });

    loadAccounts();
}

async function deleteAccount(id){

    await fetch(`${API_URL}/${id}`,{

        method:"DELETE"
    });

    loadAccounts();
}

</script>

</body>
</html>
